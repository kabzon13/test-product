#cloud-config
# Droplet bootstrap. Rendered by terraform (templatefile).
# ASCII only: non-ASCII bytes break cloud-init YAML parsing on some providers.

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - chrony
  - curl

users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
      - no-agent-forwarding,no-X11-forwarding,no-pty ${ssh_public_key}

write_files:
  # container log rotation
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }

  # cron: uptime ping (pull model), pg_dump to Spaces, cert expiry metric.
  # Scripts arrive with the first deploy into /opt/app/scripts; until then cron exits silently.
  - path: /etc/cron.d/app
    content: |
      SHELL=/bin/bash
      * * * * * deploy [ -x /opt/app/scripts/uptime-ping.sh ] && /opt/app/scripts/uptime-ping.sh >/dev/null 2>&1
      17 3 * * * deploy [ -x /opt/app/scripts/db-backup.sh ] && /opt/app/scripts/db-backup.sh >> /var/log/db-backup.log 2>&1
      */15 * * * * root [ -x /opt/app/scripts/cert-metric.sh ] && /opt/app/scripts/cert-metric.sh >/dev/null 2>&1

runcmd:
  - mkdir -p /opt/app/certs /opt/app/caddy /opt/app/scripts /var/lib/node_exporter/textfile
  - chown -R deploy:deploy /opt/app
  # 2G swap: OOM protection for load spikes
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - systemctl enable --now chrony
  - systemctl restart docker
