apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: cp-telegram
        type: telegram
        settings:
          bottoken: '$ALERT_TELEGRAM_BOT_TOKEN'
          # двойные кавычки ВНУТРИ значения обязательны: Grafana после подстановки
          # переменной заново типизирует скаляр, и числовой chat id становится числом,
          # а нужна строка. С кавычками результат остаётся строкой.
          chatid: '"$ALERT_TELEGRAM_CHAT_ID"'

  - orgId: 1
    name: email
    receivers:
      - uid: cp-email
        type: email
        settings:
          addresses: '$ALERT_EMAIL_TO'
